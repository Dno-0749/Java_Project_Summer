{% extends "layouts/passenger_base.html" %}

{% block content %}
<div class="p-card text-center">
    <div class="text-muted small mb-3">Đưa mã này cho nhân viên quét để check-in</div>

    <div class="p-qr-box mb-3">
        {{ passenger.card_id }}
    </div>

    <div class="fw-bold">{{ passenger.name }}</div>
    <div class="text-muted small">Cabin {{ passenger.cabin }}</div>

    <div class="alert alert-info small mt-3 mb-0 text-start">
        <i class="bi bi-info-circle me-1"></i>
        Mã này cũng dùng để xác thực tại các điểm bán hàng (POS) trên tàu.
    </div>
</div>
{% endblock %}
