{% extends "layouts/base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary me-2"></i>Thêm hoạt động mới</h4>
            <small class="text-muted">Tạo hoạt động mới cho du khách trên tàu</small>
        </div>
        <a href="{{ url_for('activities.activities') }}" class="btn btn-outline-secondary">Quay lại</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên hoạt động</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Địa điểm</label>
                        <input type="text" name="location" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Khung giờ</label>
                        <input type="text" name="time" class="form-control" placeholder="06:30 - 07:30" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sức chứa</label>
                        <input type="number" name="capacity" class="form-control" min="0" value="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá vé</label>
                        <input type="number" name="price" class="form-control" min="0" value="0">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Loại phí</label>
                        <select name="type" class="form-select">
                            <option value="Miễn phí">Miễn phí</option>
                            <option value="Trả phí">Trả phí</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('activities.activities') }}" class="btn btn-outline-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu hoạt động</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
