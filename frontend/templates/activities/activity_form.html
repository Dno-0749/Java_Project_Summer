{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-music-note-list text-primary me-2"></i>
        {{ "Sửa hoạt động" if edit_mode else "Tạo hoạt động mới" }}
    </h4>
    <a href="{{ url_for('activities.activities') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4" style="max-width: 640px;">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên hoạt động *</label>
                <input type="text" name="name" class="form-control" required
                       value="{{ activity.name if activity else '' }}" placeholder="VD: Yoga buổi sáng">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Địa điểm</label>
                <input type="text" name="location" class="form-control"
                       value="{{ activity.location if activity else '' }}" placeholder="VD: Sundeck">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Mô tả</label>
                <textarea name="description" class="form-control" rows="3">{{ activity.description if activity else '' }}</textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Ngày diễn ra</label>
                    <input type="date" name="date" class="form-control" value="{{ activity.date if activity else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Giờ bắt đầu</label>
                    <input type="time" name="start_time" class="form-control" value="{{ activity.start_time_only if activity else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Giờ kết thúc</label>
                    <input type="time" name="end_time" class="form-control" value="{{ activity.end_time_only if activity else '' }}">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Sức chứa (số khách tối đa)</label>
                    <input type="number" name="capacity" class="form-control" min="1"
                           value="{{ activity.capacity if activity else '' }}" placeholder="VD: 40">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phí tham gia (đ)</label>
                    <input type="number" name="fee" class="form-control" min="0" step="1000"
                           value="{{ activity.fee if activity else 0 }}" placeholder="0 = Miễn phí">
                </div>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" name="is_included_in_package" class="form-check-input" id="pkg"
                       {% if activity and activity.is_included_in_package %}checked{% endif %}>
                <label class="form-check-label" for="pkg">Đã bao gồm trong gói tour (miễn phí thêm)</label>
            </div>

            <button type="submit" class="btn btn-primary px-4">
                {{ "Lưu thay đổi" if edit_mode else "Tạo hoạt động" }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
