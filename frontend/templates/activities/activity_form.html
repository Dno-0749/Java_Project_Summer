{% extends "layouts/base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">
                <i class="bi bi-{% if edit_mode %}pencil-square{% else %}plus-circle{% endif %} text-primary me-2"></i>
                {% if edit_mode %}Sửa hoạt động{% else %}Thêm hoạt động mới{% endif %}
            </h4>
            <small class="text-muted">Quản lý thông tin hoạt động trên tàu</small>
        </div>
        <a href="{{ url_for('activities.activities') }}" class="btn btn-outline-secondary">Quay lại</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên hoạt động</label>
                        <input type="text" name="name" class="form-control" value="{{ activity.name if activity else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Địa điểm</label>
                        <input type="text" name="location" class="form-control" value="{{ activity.location if activity else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Thời gian bắt đầu</label>
                        <input type="text" name="start_time" class="form-control" placeholder="06:30">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Thời gian kết thúc</label>
                        <input type="text" name="end_time" class="form-control" placeholder="07:30">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sức chứa</label>
                        <input type="number" name="capacity" class="form-control" min="0" value="{{ activity.capacity if activity else 0 }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá vé</label>
                        <input type="number" name="price" class="form-control" min="0" value="{{ activity.price if activity else 0 }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Loại phí</label>
                        <select name="type" class="form-select">
                            <option value="Miễn phí">Miễn phí</option>
                            <option value="Trả phí">Trả phí</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Trạng thái</label>
                        <select name="status" class="form-select">
                            <option value="Sắp diễn ra">Sắp diễn ra</option>
                            <option value="Đang diễn ra">Đang diễn ra</option>
                            <option value="Đã hoàn thành">Đã hoàn thành</option>
                            <option value="Đã hủy">Đã hủy</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả</label>
                        <textarea name="description" class="form-control" rows="4">{{ activity.description if activity else '' }}</textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('activities.activities') }}" class="btn btn-outline-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">{% if edit_mode %}Lưu thay đổi{% else %}Tạo hoạt động{% endif %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
