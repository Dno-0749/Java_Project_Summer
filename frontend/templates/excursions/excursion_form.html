{% extends "layouts/base.html" %}

{% block title %}
{{ "Chỉnh sửa tour" if edit_mode else "Tạo tour tham quan" }}
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">
                {{ "Chỉnh sửa tour" if edit_mode else "Tạo tour tham quan" }}
            </h2>
            <p class="text-muted mb-0">
                Quản lý thông tin hoạt động tham quan trên bờ
            </p>
        </div>

        <a
            href="{{ url_for('excursions.excursions') }}"
            class="btn btn-outline-secondary"
        >
            <i class="bi bi-arrow-left"></i>
            Quay lại
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <form
                method="POST"
                action="{% if edit_mode %}{{ url_for('excursions.edit_excursion', excursion_id=excursion.id) }}{% else %}{{ url_for('excursions.create_excursion') }}{% endif %}"
            >

                <div class="row g-4">

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">
                            Tên tour
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                            value="{{ excursion.name if edit_mode else '' }}"
                        >
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">
                            Nhà cung cấp
                        </label>

                        <select
                            name="provider_id"
                            class="form-select"
                            required
                        >
                            <option value="">
                                -- Chọn nhà cung cấp --
                            </option>

                            {% for provider in providers %}
                            <option
                                value="{{ provider.id }}"
                                {% if edit_mode and excursion.provider_id == provider.id %}selected{% endif %}
                            >
                                {{ provider.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Địa điểm
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            required
                            value="{{ excursion.location if edit_mode else '' }}"
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">
                            Ngày
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            required
                            value="{{ excursion.date if edit_mode else '' }}"
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">
                            Thời gian
                        </label>

                        <input
                            type="text"
                            name="time"
                            class="form-control"
                            required
                            value="{{ excursion.time if edit_mode else '' }}"
                            placeholder="08:00 - 16:00"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Sức chứa
                        </label>

                        <input
                            type="number"
                            name="capacity"
                            class="form-control"
                            min="1"
                            required
                            value="{{ excursion.capacity if edit_mode else '' }}"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Giá tour
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                name="price"
                                class="form-control"
                                min="0"
                                required
                                value="{{ excursion.price if edit_mode else 0 }}"
                            >

                            <span class="input-group-text">
                                VNĐ
                            </span>

                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Trạng thái
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            {% for status in [
                                "Sắp diễn ra",
                                "Đang diễn ra",
                                "Hoàn thành",
                                "Trì hoãn",
                                "Hủy"
                            ] %}

                            <option
                                value="{{ status }}"
                                {% if edit_mode and excursion.status == status %}selected{% endif %}
                            >
                                {{ status }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">
                            Mô tả
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                        >{{ excursion.description if edit_mode else '' }}</textarea>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a
                        href="{{ url_for('excursions.excursions') }}"
                        class="btn btn-outline-secondary"
                    >
                        Hủy
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-lg"></i>
                        {{ "Lưu thay đổi" if edit_mode else "Tạo tour" }}
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
