{% extends "layouts/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-geo-alt text-primary me-2"></i>
        {{ "Sửa tour trên bờ" if edit_mode else "Tạo tour trên bờ mới" }}
    </h4>
    <a href="{{ url_for('excursions.excursions') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4" style="max-width: 640px;">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên tour *</label>
                <input type="text" name="name" class="form-control" required
                       value="{{ excursion.name if excursion else '' }}" placeholder="VD: Tour Phú Quốc - Hòn Thơm">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Đơn vị cung cấp tour</label>
                <input type="text" name="provider_name" class="form-control"
                       value="{{ excursion.provider_name if excursion else '' }}" placeholder="VD: Công ty du lịch ABC">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Ngày diễn ra *</label>
                <input type="date" name="date" class="form-control" required value="{{ excursion.date if excursion else '' }}">
                {% if edit_mode %}<div class="form-text">Đổi ngày sẽ không tự chuyển tour sang lịch trình ngày khác trong bản demo này.</div>{% endif %}
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Giờ tập trung</label>
                    <input type="time" name="gathering_time" class="form-control" value="{{ excursion.gathering_time_only if excursion else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Giờ quay lại tàu</label>
                    <input type="time" name="return_time" class="form-control" value="{{ excursion.return_time_only if excursion else '' }}">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Sức chứa (số khách tối đa)</label>
                    <input type="number" name="capacity" class="form-control" min="1"
                           value="{{ excursion.capacity if excursion else '' }}" placeholder="VD: 80">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Giá vé (đ)</label>
                    <input type="number" name="price" class="form-control" min="0" step="1000"
                           value="{{ excursion.price if excursion else 0 }}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary px-4">
                {{ "Lưu thay đổi" if edit_mode else "Tạo tour" }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
