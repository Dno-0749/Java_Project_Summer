{% extends "layouts/base.html" %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-geo-alt-fill text-primary me-2"></i>Tạo tour tham quan mới</h4>
            <small class="text-muted">Tạo tour tham quan bờ mới cho hành khách</small>
        </div>
        <a class="btn btn-outline-secondary" href="{{ url_for('excursions.excursions') }}">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <form method="post" action="{{ url_for('excursions.register_excursion') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên tour tham quan</label>
                        <input type="text" class="form-control" name="tour_name" required placeholder="Nhập tên tour">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ngày khởi hành</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sức chứa</label>
                        <input type="number" class="form-control" name="capacity" value="30" min="1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá vé / khách</label>
                        <input type="number" class="form-control" name="price" value="0" min="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" name="status">
                            <option>Còn chỗ</option>
                            <option>Hết chỗ</option>
                            <option>Đã kết thúc</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Ghi chú</label>
                        <input type="text" class="form-control" name="note" placeholder="Ghi chú tour">
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-check-circle me-1"></i>Tạo tour</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('excursions.excursions') }}">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
