{% extends "layouts/passenger_base.html" %}

{% block content %}
<a href="{{ url_for('passenger.services') }}" class="small d-inline-block mb-2"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>

<div class="p-card">
    <h5 class="fw-bold">{{ service.name }}</h5>
    <div class="text-muted small mb-3">{{ service.category }}</div>

    <div class="d-flex justify-content-between py-2 border-bottom small">
        <span class="text-muted">Giá</span>
        <span class="fw-semibold text-primary">{{ "{:,.0f}".format(service.price) }}đ</span>
    </div>

    <div class="mt-3">
        <form method="POST" action="{{ url_for('passenger.purchase_service', item_id=service.id) }}">
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-bag-check me-2"></i>Yêu cầu sử dụng dịch vụ này
            </button>
        </form>
        <div class="text-muted small mt-2 text-center">Chi phí sẽ được cộng vào tài khoản chi tiêu trên tàu của bạn</div>

        <a href="{{ url_for('passenger.feedback_new', kind='service', item_id=service.id) }}" class="btn btn-outline-primary w-100 mt-2">
            <i class="bi bi-star me-2"></i>Đánh giá dịch vụ này
        </a>
    </div>
</div>
{% endblock %}
