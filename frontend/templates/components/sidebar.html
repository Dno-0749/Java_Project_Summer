    <div class="list-group list-group-flush">

        <a href="{{ url_for('reports.index') }}"
           class="list-group-item list-group-item-action bg-dark text-white border-0 {% if request.endpoint.startswith('reports.') %}active{% endif %}">

           class="list-group-item list-group-item-action bg-dark text-white border-0 {% if request.endpoint == 'operations.checkin_monitor' %}active{% endif %}">

    <div class="sidebar-footer px-3 py-3 mt-auto">
        <div class="text-secondary small">
