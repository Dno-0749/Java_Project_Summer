{% extends "layouts/base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary me-2"></i>Tạo tour mới</h4>
            <small class="text-muted">Thêm chuyến mới cho lịch trình</small>
        </div>
        <a href="{{ url_for('coordinator.itinerary') }}" class="btn btn-outline-secondary">Quay lại</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên tour</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ngày bắt đầu</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ngày kết thúc</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Trạng thái</label>
                        <select name="status" class="form-select">
                            <option value="Sắp khởi hành">Sắp khởi hành</option>
                            <option value="Đang diễn ra">Đang diễn ra</option>
                            <option value="Đã kết thúc">Đã kết thúc</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Danh sách cảng (mỗi dòng 1 cảng)</label>
                        <textarea name="ports" rows="4" class="form-control" placeholder="Hạ Long&#10;Cát Bà&#10;Lan Hạ"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('coordinator.itinerary') }}" class="btn btn-outline-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu tour</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
