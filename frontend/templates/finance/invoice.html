{% extends "layouts/base.html" %}

{% block content %}
<div class="mx-auto bg-white shadow-sm p-4" style="max-width: 520px; border-radius: 12px;">
    <div class="text-center mb-3">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        <h5 class="fw-bold mt-2">Hóa đơn cuối chuyến #{{ invoice.id }}</h5>
        <div class="text-muted small">Tài khoản #{{ invoice.account_id }}</div>
    </div>

    <div class="d-flex justify-content-between py-2 border-bottom">
        <span class="text-muted">Trạng thái</span>
        <span class="badge bg-success">{{ invoice.status }}</span>
    </div>
    <div class="d-flex justify-content-between py-2 border-bottom">
        <span class="text-muted">Ngày xuất</span>
        <span>{{ invoice.issued_at }}</span>
    </div>
    <div class="d-flex justify-content-between py-3">
        <span class="fw-bold fs-5">Tổng tiền cần thu</span>
        <span class="fw-bold fs-4 text-primary">{{ "{:,.0f}".format(invoice.total_amount) }}đ</span>
    </div>

    <div class="d-flex gap-2 mt-3">
        <button onclick="window.print()" class="btn btn-outline-secondary flex-grow-1">
            <i class="bi bi-printer me-2"></i>In hóa đơn
        </button>
        <a href="{{ url_for('finance.settlement') }}" class="btn btn-primary flex-grow-1">
            Quay lại danh sách
        </a>
    </div>
</div>
{% endblock %}
